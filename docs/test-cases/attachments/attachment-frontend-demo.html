<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read 受管附件验证</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 16px;
        color: #58a6ff;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .toolbar input {
        background: #161b22;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        width: 320px;
      }
      .toolbar button {
        background: #238636;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar button:hover {
        background: #2ea043;
      }
      .toolbar button:disabled {
        background: #21262d;
        color: #484f58;
        cursor: not-allowed;
      }
      .toolbar button.danger {
        background: #da3633;
      }
      .toolbar button.danger:hover {
        background: #f85149;
      }
      .status-bar {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 16px;
        min-height: 20px;
      }
      .status-bar .ok {
        color: #3fb950;
      }
      .status-bar .err {
        color: #f85149;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
      }
      .card-header {
        padding: 12px 16px;
        border-bottom: 1px solid #30363d;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-header h2 {
        font-size: 15px;
        font-weight: 600;
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 600;
      }
      .badge.pass {
        background: rgba(63, 185, 80, 0.15);
        color: #3fb950;
      }
      .badge.fail {
        background: rgba(248, 81, 73, 0.15);
        color: #f85149;
      }
      .badge.skip {
        background: rgba(139, 148, 158, 0.15);
        color: #8b949e;
      }
      .badge.run {
        background: rgba(88, 166, 255, 0.15);
        color: #58a6ff;
      }
      .card-body {
        padding: 16px;
      }
      .card-body pre {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        color: #8b949e;
        max-height: 200px;
        overflow-y: auto;
      }
      .attachment-preview {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .attachment-preview img {
        max-width: 300px;
        max-height: 300px;
        border-radius: 6px;
        border: 1px solid #30363d;
      }
      .attachment-preview iframe {
        width: 100%;
        height: 400px;
        border: 1px solid #30363d;
        border-radius: 6px;
      }
      .attachment-preview .download-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        min-width: 200px;
      }
      .attachment-preview .download-card a {
        color: #58a6ff;
        text-decoration: none;
        font-size: 13px;
      }
      .attachment-preview .download-card a:hover {
        text-decoration: underline;
      }
      .meta-table {
        width: 100%;
        font-size: 12px;
        margin-top: 8px;
      }
      .meta-table td {
        padding: 2px 8px;
      }
      .meta-table td:first-child {
        color: #8b949e;
        width: 120px;
      }
      .check-list {
        font-size: 12px;
        margin-top: 8px;
      }
      .check-list div {
        padding: 2px 0;
      }
      .check-list .pass {
        color: #3fb950;
      }
      .check-list .fail {
        color: #f85149;
      }
      .summary {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .summary-table {
        width: 100%;
        font-size: 13px;
        border-collapse: collapse;
      }
      .summary-table th,
      .summary-table td {
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #21262d;
      }
      .summary-table th {
        color: #8b949e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Read 受管附件前端验证</h1>

    <div class="toolbar">
      <input id="apiBase" value="http://localhost:14096" placeholder="API Base URL" />
      <button id="btnRun" onclick="runAll()">运行全部</button>
      <button id="btnCleanup" class="danger" onclick="cleanup()" disabled>清理</button>
    </div>

    <div id="statusBar" class="status-bar">点击"运行全部"开始</div>

    <div id="summary" class="summary" style="display: none">
      <table class="summary-table">
        <thead>
          <tr>
            <th>编号</th>
            <th>能力</th>
            <th>结果</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>

    <div id="grid" class="grid"></div>

    <script>
      var SID = null
      var results = []
      var attachmentUrls = {}

      function setStatus(msg, type) {
        var bar = document.getElementById("statusBar")
        bar.innerHTML = msg
        bar.className = "status-bar" + (type ? " " + type : "")
      }

      function apiBase() {
        return document.getElementById("apiBase").value.replace(/\/$/, "")
      }

      async function api(path, options) {
        options = options || {}
        var res = await fetch(apiBase() + path, {
          method: options.method || "GET",
          headers: Object.assign({ "Content-Type": "application/json" }, options.headers || {}),
          body: options.body ? JSON.stringify(options.body) : undefined,
          signal: AbortSignal.timeout(240000),
        })
        var text = await res.text()
        var body
        try {
          body = JSON.parse(text)
        } catch (e) {
          body = text
        }
        if (!res.ok) throw new Error(path + ": HTTP " + res.status + " " + text.slice(0, 200))
        return body
      }

      function createCard(id, title) {
        var div = document.createElement("div")
        div.className = "card"
        div.id = "card-" + id
        div.innerHTML =
          '<div class="card-header"><h2>' +
          title +
          '</h2><span class="badge skip" id="badge-' +
          id +
          '">PENDING</span></div><div class="card-body" id="body-' +
          id +
          '"></div>'
        document.getElementById("grid").appendChild(div)
        return div
      }

      function setBadge(id, status, label) {
        var badge = document.getElementById("badge-" + id)
        badge.className = "badge " + status
        badge.textContent = label || status.toUpperCase()
      }

      function setBody(id, html) {
        document.getElementById("body-" + id).innerHTML = html
      }

      function addResult(id, label, pass) {
        results.push({ id: id, label: label, pass: pass })
        setBadge(id, pass ? "pass" : "fail", pass ? "PASS" : "FAIL")
        updateSummary()
      }

      function updateSummary() {
        var tbody = document.getElementById("summaryBody")
        tbody.innerHTML = results
          .map(function (r) {
            return (
              "<tr><td>" +
              r.id +
              "</td><td>" +
              r.label +
              '</td><td><span class="badge ' +
              (r.pass ? "pass" : "fail") +
              '">' +
              (r.pass ? "PASS" : "FAIL") +
              "</span></td></tr>"
            )
          })
          .join("")
        document.getElementById("summary").style.display = "block"
      }

      async function execCmd(command) {
        return api("/session/" + SID + "/exec", {
          method: "POST",
          body: { command: command, workingDirectory: "/workspace", timeoutSeconds: 60 },
        })
      }

      async function readFile(filePath) {
        await api("/session/" + SID + "/message", {
          method: "POST",
          body: {
            parts: [{ type: "text", text: "只调用 read 工具读取 " + filePath + "，不要调用其他工具。" }],
            model: { providerID: "zhipuai", modelID: "glm-5.1" },
          },
        })
        var messages = await api("/session/" + SID + "/message")
        var states = messages
          .flatMap(function (m) {
            return m.parts || []
          })
          .filter(function (p) {
            return p.type === "tool" && p.tool === "read"
          })
          .map(function (p) {
            return p.state
          })
        if (!states.length) throw new Error("no read tool state")
        return states[states.length - 1]
      }

      function metaHtml(s) {
        var rows = ""
        if (s.metadata) {
          for (var k in s.metadata) {
            rows += "<tr><td>" + k + "</td><td>" + s.metadata[k] + "</td></tr>"
          }
        }
        return '<table class="meta-table">' + rows + "</table>"
      }

      function checkHtml(checks) {
        return (
          '<div class="check-list">' +
          checks
            .map(function (c) {
              return '<div class="' + (c.pass ? "pass" : "fail") + '">' + (c.pass ? "✓" : "✗") + " " + c.label + "</div>"
            })
            .join("") +
          "</div>"
        )
      }

      async function sha256(buf) {
        var hash = await crypto.subtle.digest("SHA-256", buf)
        return Array.from(new Uint8Array(hash))
          .map(function (b) {
            return b.toString(16).padStart(2, "0")
          })
          .join("")
      }

      async function runAll() {
        document.getElementById("btnRun").disabled = true
        results = []
        document.getElementById("grid").innerHTML = ""
        document.getElementById("summary").style.display = "none"

        try {
          // 1. 创建 Session
          setStatus("创建 Session...", "ok")
          var session = await api("/session", { method: "POST", body: {} })
          SID = session.id
          await api("/session/" + SID + "/keep-alive", {
            method: "POST",
            body: { enabled: true, boot: true },
          })
          setStatus("Session=" + SID + "，Sandbox 已启动", "ok")

          // 2. 创建夹具
          setStatus("创建测试夹具...", "ok")
          var fixtures = [
            ["mkdir -p /workspace/read-fixtures && printf 'alpha\\nbeta\\ngamma\\n' > /workspace/read-fixtures/text.txt && : > /workspace/read-fixtures/empty.txt", "text + empty"],
            ["printf '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"120\" viewBox=\"0 0 200 120\"><circle cx=\"60\" cy=\"60\" r=\"40\" fill=\"#58a6ff\"/><rect x=\"100\" y=\"20\" width=\"80\" height=\"80\" fill=\"#3fb950\" rx=\"8\"/><text x=\"100\" y=\"110\" font-size=\"14\" fill=\"#c9d1d9\">SVG Test</text></svg>\\n' > /workspace/read-fixtures/vector.svg", "svg"],
            [
              "node -e \"const z=require('zlib');const c=(n,d)=>{const t=Array.from({length:256},(_,i)=>{let c=i;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0});let s=-1;for(const b of Buffer.concat([Buffer.from(n),d]))s=(s>>>8)^t[(s^b)&255];return(s^=-1)>>>0};const ch=(n,d)=>{const b=Buffer.alloc(12+d.length);b.writeUInt32BE(d.length,0);Buffer.from(n).copy(b,4);d.copy(b,8);b.writeUInt32BE(c(n,d),8+d.length);return b};const w=64,h=64,r=Buffer.alloc((w*3+1)*h);for(let y=0;y<h;y++){const o=y*(w*3+1);r[o]=0;for(let x=0;x<w;x++){const i=o+1+x*3;r[i]=x*4%256;r[i+1]=y*4%256;r[i+2]=(x+y)*2%256}};const ih=Buffer.alloc(13);ih.writeUInt32BE(w,0);ih.writeUInt32BE(h,4);ih[8]=8;ih[9]=2;const png=Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),ch('IHDR',ih),ch('IDAT',z.deflateSync(r)),ch('IEND',Buffer.alloc(0))]);require('fs').writeFileSync('/workspace/read-fixtures/pixel.png',png)\"",
              "png",
            ],
            [
              "node -e \"const s=[];const o=(t)=>{s.push(t);return s.length-1};o('%PDF-1.4');o('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj');o('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj');o('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 200]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj');o('4 0 obj<</Length 44>>stream\\nBT /F1 12 Tf 50 150 Td (Hello PDF) Tj ET\\nendstream endobj');o('5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj');var x=s.length;o('xref\\n0 '+(x+1)+'\\n0000000000 65535 f ');s.slice(1).forEach(function(l,i){o(String(i+1).padStart(10,'0')+' 00000 n ')});o('trailer<</Size '+(x+1)+'/Root 1 0 R>>');o('startxref');o('%%EOF');require('fs').writeFileSync('/workspace/read-fixtures/sample.pdf',Buffer.from(s.join('\\n'),'latin1'))\"",
              "pdf",
            ],
            ["printf 'UEsDBAo=' | base64 -d > /workspace/read-fixtures/sample.docx", "docx"],
            ["printf 'f0VMRg==' | base64 -d > /workspace/read-fixtures/program", "binary"],
            ["printf '//4=' | base64 -d > /workspace/read-fixtures/invalid-utf8.txt", "invalid utf8"],
            ["printf 'iVBORw0KGgo=' | base64 -d > /workspace/read-fixtures/oversized.png && dd if=/dev/zero bs=1048576 count=21 >> /workspace/read-fixtures/oversized.png 2>/dev/null", "oversized"],
          ]

          for (var i = 0; i < fixtures.length; i++) {
            var r = await execCmd(fixtures[i][0])
            if (r.exitCode !== 0) throw new Error("fixture " + fixtures[i][1] + " failed: " + JSON.stringify(r))
          }
          setStatus("夹具就绪，开始读取...", "ok")

          // T-READ-01 文本
          await testCase("01", "UTF-8 文本分页", "/workspace/read-fixtures/text.txt", function (s) {
            var checks = [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.metadata && s.metadata.kind === "text", label: "kind=text" },
              { pass: s.output && s.output.includes("alpha"), label: "output 含 alpha" },
              { pass: s.output && s.output.includes("beta"), label: "output 含 beta" },
            ]
            return checks
          })

          // T-READ-02 空文件
          await testCase("02", "空文件", "/workspace/read-fixtures/empty.txt", function (s) {
            return [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.output && s.output.includes("total 0 lines"), label: "output 含 total 0 lines" },
            ]
          })

          // T-READ-03 SVG
          await testCase("03", "SVG 走文本路径", "/workspace/read-fixtures/vector.svg", function (s) {
            return [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.metadata && s.metadata.kind === "svg", label: "kind=svg" },
              { pass: !s.attachments || s.attachments.length === 0, label: "无附件（纯文本）" },
            ]
          }, function (s) {
            // 从 output 中提取 SVG 并渲染
            var match = (s.output || "").match(/<svg[\s\S]*<\/svg>/)
            if (match) {
              return '<div style="margin-top:12px;padding:16px;background:#fff;border-radius:6px;display:flex;justify-content:center">' + match[0] + "</div>"
            }
            return ""
          })

          // T-READ-04 非法 UTF-8
          await testCase("04", "非法 UTF-8", "/workspace/read-fixtures/invalid-utf8.txt", function (s) {
            return [
              { pass: s.status === "error", label: "status=error" },
              { pass: String(s.error).includes("valid UTF-8"), label: "error 含 valid UTF-8" },
            ]
          })

          // T-READ-05 PNG 附件
          await testAttachment("05", "PNG 附件化", "/workspace/read-fixtures/pixel.png", function (s) {
            var checks = [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.metadata && s.metadata.kind === "image", label: "kind=image" },
              { pass: s.metadata && s.metadata.mime === "image/png", label: "mime=image/png" },
            ]
            var url = s.attachments && s.attachments[0] ? s.attachments[0].url : ""
            attachmentUrls.png = url
            checks.push({ pass: url.startsWith("/session/" + SID + "/attachment/"), label: "url 是受管路径" })
            checks.push({ pass: !url.startsWith("data:"), label: "url 不是 Data URL" })
            return { checks: checks, url: url, mime: "image/png" }
          })

          // T-READ-06 PDF 附件
          await testAttachment("06", "PDF 附件化", "/workspace/read-fixtures/sample.pdf", function (s) {
            var checks = [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.metadata && s.metadata.kind === "pdf", label: "kind=pdf" },
            ]
            var url = s.attachments && s.attachments[0] ? s.attachments[0].url : ""
            attachmentUrls.pdf = url
            checks.push({ pass: url.startsWith("/session/" + SID + "/attachment/"), label: "url 是受管路径" })
            return { checks: checks, url: url, mime: "application/pdf" }
          })

          // T-READ-07 Office 附件
          await testAttachment("07", "Office 仅展示", "/workspace/read-fixtures/sample.docx", function (s) {
            var checks = [
              { pass: s.status === "completed", label: "status=completed" },
              { pass: s.metadata && s.metadata.kind === "office", label: "kind=office" },
              { pass: s.metadata && s.metadata.textExtracted === false, label: "textExtracted=false" },
            ]
            var url = s.attachments && s.attachments[0] ? s.attachments[0].url : ""
            attachmentUrls.office = url
            return { checks: checks, url: url, mime: "office" }
          })

          // T-READ-12 二进制拒绝
          await testCase("12", "已知二进制拒绝", "/workspace/read-fixtures/program", function (s) {
            return [
              { pass: s.status === "error", label: "status=error" },
              { pass: String(s.error).includes("binary file"), label: "error 含 binary file" },
              { pass: !s.attachments || s.attachments.length === 0, label: "无附件" },
            ]
          })

          // T-READ-13 超限拒绝
          await testCase("13", "超过 20MB 拒绝", "/workspace/read-fixtures/oversized.png", function (s) {
            return [
              { pass: s.status === "error", label: "status=error" },
              { pass: String(s.error).includes("ingestion limit"), label: "error 含 ingestion limit" },
              { pass: !s.attachments || s.attachments.length === 0, label: "无附件" },
            ]
          })

          // T-READ-08~11 下载协议（PNG）
          if (attachmentUrls.png) {
            await testDownload("08", "Range 206", attachmentUrls.png, async function () {
              var res = await fetch(apiBase() + attachmentUrls.png, { headers: { Range: "bytes=0-7" } })
              var buf = new Uint8Array(await res.arrayBuffer())
              var sig = Array.from(buf)
                .map(function (b) {
                  return b.toString(16).padStart(2, "0")
                })
                .join("")
              return [
                { pass: res.status === 206, label: "HTTP 206" },
                { pass: buf.length === 8, label: "返回 8 字节" },
                { pass: sig === "89504e470d0a1a0a", label: "PNG signature 匹配" },
              ]
            })

            await testDownload("09", "非法 Range 416", attachmentUrls.png, async function () {
              var res = await fetch(apiBase() + attachmentUrls.png, { headers: { Range: "bytes=999999-" } })
              return [{ pass: res.status === 416, label: "HTTP 416" }]
            })

            await testDownload("10", "ETag 304", attachmentUrls.png, async function () {
              var res1 = await fetch(apiBase() + attachmentUrls.png)
              var etag = res1.headers.get("etag")
              var res2 = await fetch(apiBase() + attachmentUrls.png, { headers: { "If-None-Match": etag || "" } })
              return [
                { pass: !!etag, label: "ETag 存在: " + etag },
                { pass: res2.status === 304, label: "If-None-Match 返回 304" },
              ]
            })

            await testDownload("11", "字节完整性 SHA-256", attachmentUrls.png, async function () {
              var dlBuf = await (await fetch(apiBase() + attachmentUrls.png)).arrayBuffer()
              var dlSha = await sha256(dlBuf)
              var srcResult = await execCmd("sha256sum /workspace/read-fixtures/pixel.png")
              var srcSha = srcResult.stdout.trim().split(/\s+/)[0]
              return [
                { pass: dlSha === srcSha, label: "SHA-256 一致" },
                { pass: true, label: "downloaded=" + dlSha.slice(0, 16) + "..." },
                { pass: true, label: "source=" + srcSha.slice(0, 16) + "..." },
              ]
            })
          }

          // T-READ-14 PG 安全
          createCard("14", "PG payload 安全")
          setBadge("14", "run", "CHECK")
          try {
            var pgResult = await execCmd(
              "psql 'postgresql://local@127.0.0.1:5432/opencode' -Atc \"SELECT count(*) FROM part WHERE session_id = '" +
                SID +
                "' AND (data::text LIKE '%data:image/%' OR data::text LIKE '%base64,%')\"",
            )
            var count = pgResult.stdout.trim()
            var checks = [{ pass: count === "0", label: "PG 中无 Base64/Data URL: count=" + count }]
            setBody("14", checkHtml(checks))
            addResult("14", "PG payload 安全", checks.every(function (c) { return c.pass }))
          } catch (e) {
            setBody("14", '<pre>' + e.message + "\n\n(psql 可能不在 sandbox 中，跳过此检查)</pre>")
            setBadge("14", "skip", "SKIP")
          }

          // T-READ-15 Sandbox 重建后持久性
          if (attachmentUrls.png) {
            createCard("15", "Sandbox 重建后附件持久")
            setBadge("15", "run", "RUN")
            try {
              await api("/session/" + SID + "/kill-sandbox", { method: "POST" })
              await api("/session/" + SID + "/keep-alive", { method: "POST", body: { enabled: true, boot: true } })
              var rebuildBuf = await (await fetch(apiBase() + attachmentUrls.png)).arrayBuffer()
              var rebuildSha = await sha256(rebuildBuf)
              var srcResult2 = await execCmd("sha256sum /workspace/read-fixtures/pixel.png")
              var srcSha2 = srcResult2.stdout.trim().split(/\s+/)[0]
              var checks15 = [{ pass: rebuildSha === srcSha2, label: "重建后 SHA-256 一致" }]
              setBody("15", checkHtml(checks15))
              addResult("15", "Sandbox 重建持久性", checks15.every(function (c) { return c.pass }))
            } catch (e) {
              setBody("15", '<pre>' + e.message + "</pre>")
              addResult("15", "Sandbox 重建持久性", false)
            }
          }

          var passCount = results.filter(function (r) { return r.pass }).length
          setStatus("完成：" + passCount + "/" + results.length + " 通过", passCount === results.length ? "ok" : "err")
        } catch (e) {
          setStatus("FATAL: " + e.message, "err")
        } finally {
          document.getElementById("btnRun").disabled = false
          document.getElementById("btnCleanup").disabled = false
        }
      }

      async function testCase(id, title, filePath, verifyFn, renderFn) {
        createCard(id, title)
        setBadge(id, "run", "READ")
        try {
          var s = await readFile(filePath)
          var checks = verifyFn(s)
          var allPass = checks.every(function (c) { return c.pass })
          var html =
            '<pre>status=' + s.status + "\nkind=" + (s.metadata ? s.metadata.kind : "?") + "\noutput=" + (s.output || s.error || "").slice(0, 200) + "</pre>" +
            metaHtml(s) +
            checkHtml(checks)
          if (renderFn) html += renderFn(s)
          setBody(id, html)
          addResult(id, title, allPass)
        } catch (e) {
          setBody(id, '<pre>' + e.message + "</pre>")
          addResult(id, title, false)
        }
      }

      async function testAttachment(id, title, filePath, verifyFn) {
        createCard(id, title)
        setBadge(id, "run", "READ")
        try {
          var s = await readFile(filePath)
          var result = verifyFn(s)
          var checks = result.checks
          var allPass = checks.every(function (c) { return c.pass })
          var html = '<pre>status=' + s.status + "\noutput=" + (s.output || "").slice(0, 100) + "</pre>" + metaHtml(s) + checkHtml(checks)

          // 渲染附件预览
          if (result.url && allPass) {
            var fullUrl = apiBase() + result.url
            html += '<div class="attachment-preview">'
            if (result.mime === "image/png" || (result.mime && result.mime.startsWith("image/"))) {
              html += '<img src="' + fullUrl + '" alt="attachment" />'
            } else if (result.mime === "application/pdf") {
              html +=
                '<iframe src="' + fullUrl + '"></iframe>' +
                '<div class="download-card"><span>📄 PDF</span><a href="' +
                fullUrl +
                '" target="_blank">在新窗口打开</a><a href="' +
                fullUrl +
                '" download="' +
                (s.attachments[0].filename || "sample.pdf") +
                '">下载</a></div>'
            } else {
              html +=
                '<div class="download-card"><span>📎 ' +
                (s.attachments[0].filename || "file") +
                '</span><a href="' +
                fullUrl +
                '" target="_blank">下载 / 打开</a></div>'
            }
            html += "</div>"
          }
          setBody(id, html)
          addResult(id, title, allPass)
        } catch (e) {
          setBody(id, '<pre>' + e.message + "</pre>")
          addResult(id, title, false)
        }
      }

      async function testDownload(id, title, url, verifyFn) {
        createCard(id, title)
        setBadge(id, "run", "FETCH")
        try {
          var checks = await verifyFn()
          var allPass = checks.every(function (c) { return c.pass })
          setBody(id, checkHtml(checks))
          addResult(id, title, allPass)
        } catch (e) {
          setBody(id, '<pre>' + e.message + "</pre>")
          addResult(id, title, false)
        }
      }

      async function cleanup() {
        if (!SID) return
        document.getElementById("btnCleanup").disabled = true
        setStatus("清理中...", "ok")
        try {
          await api("/session/" + SID + "/keep-alive", { method: "POST", body: { enabled: false } }).catch(function () {})
          await api("/session/" + SID + "/kill-sandbox", { method: "POST" }).catch(function () {})
          await api("/session/" + SID, { method: "DELETE" }).catch(function () {})
          setStatus("已清理 Session=" + SID, "ok")
          SID = null
        } catch (e) {
          setStatus("清理失败: " + e.message, "err")
        }
      }
    </script>
  </body>
</html>
