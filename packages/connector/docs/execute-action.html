<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>execute_action 执行时序</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · packages/connector</p>
    <h1>execute_action 执行时序</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="execute-action-title execute-action-desc">
        <title id="execute-action-title">execute_action 执行时序</title>
        <desc id="execute-action-desc">Agent 工具执行第三方应用动作的完整调用链：会话编排层铸造作用域 token，经 fetch 边界调用无头引擎，幂等检查后由 provider 执行器经 guarded-fetch 调用第三方 API，结果与文件 URL 逐层返回。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ LIFELINES ============ -->
        <line x1="160" y1="128" x2="160" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="400" y1="128" x2="400" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="128" x2="640" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="880" y1="128" x2="880" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1120" y1="128" x2="1120" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ ACTIVATION BARS ============ -->
        <rect x="156" y="168" width="8" height="440" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="396" y="168" width="8" height="440" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="636" y="248" width="8" height="320" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="876" y="424" width="8" height="108" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1116" y="460" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ OPT FRAGMENT ============ -->
        <rect x="388" y="320" width="264" height="80" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="388" y="320" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="408" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="436" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[idempotent hit]</text>

        <!-- ============ MESSAGES ============ -->
        <!-- 1. Agent Tool -> Connector.Service -->
        <line x1="160" y1="168" x2="400" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="248" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="157" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">execute_action</text>

        <!-- 2. self: lookup + mint token -->
        <path d="M400,200 h24 v16 h-24" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="432" y="204" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">lookup + token</text>

        <!-- 3. Connector.Service -> Connector Runtime -->
        <line x1="400" y1="248" x2="640" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="488" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /v1/actions</text>

        <!-- 4. self: policy + idempotency -->
        <path d="M640,284 h24 v16 h-24" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="672" y="288" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="701" y="297" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">policy · idem</text>

        <!-- 5. opt: cached result early return -->
        <line x1="640" y1="360" x2="400" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="488" y="340" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">cached result</text>

        <!-- 6. Connector Runtime -> Provider Executor -->
        <line x1="640" y1="424" x2="880" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="732" y="404" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="413" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">dispatch</text>

        <!-- 7. Provider Executor -> Third-Party API (link) -->
        <line x1="880" y1="460" x2="1120" y2="460" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="984" y="440" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1000" y="449" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">https</text>

        <!-- 8. return: response -->
        <line x1="1120" y1="496" x2="880" y2="496" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="980" y="476" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1000" y="485" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">response</text>

        <!-- 9. return: result -->
        <line x1="880" y1="532" x2="640" y2="532" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="744" y="512" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="521" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">result</text>

        <!-- 10. return: Response (fetch boundary) -->
        <line x1="640" y1="568" x2="400" y2="568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="500" y="548" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="557" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Response</text>

        <!-- 11. return: result (headline success, coral) -->
        <line x1="400" y1="604" x2="160" y2="604" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="264" y="584" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="593" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">result</text>

        <!-- ============ ACTORS ============ -->
        <!-- Agent Tool -->
        <rect x="80" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="80" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="160" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent Tool</text>
        <text x="160" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">core/tool/plugin</text>

        <!-- Connector.Service (focal) -->
        <rect x="320" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="80" width="160" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="400" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Connector.Service</text>
        <text x="400" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">adapter/connector.ts</text>

        <!-- Connector Runtime -->
        <rect x="560" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="80" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Connector Runtime</text>
        <text x="640" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">engine/server · /v1</text>

        <!-- Provider Executor -->
        <rect x="800" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="80" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="880" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Provider Executor</text>
        <text x="880" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">engine/providers/*</text>

        <!-- Third-Party API -->
        <rect x="1040" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="1040" y="80" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="1120" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Third-Party API</text>
        <text x="1120" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">external http</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="130" y1="668" x2="170" y2="668" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="178" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">call</text>

        <line x1="230" y1="668" x2="270" y2="668" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="278" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">return</text>

        <line x1="345" y1="668" x2="385" y2="668" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="393" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">external http</text>

        <line x1="505" y1="668" x2="545" y2="668" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="553" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">headline success</text>

        <rect x="685" y="661" width="14" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="707" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">focal actor</text>

        <rect x="805" y="661" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="827" y="671" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">opt fragment</text>

      </svg>
    </div>
  </div>
</body>
</html>
