<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>data-table 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --color-accent-tint: rgba(191,69,32,0.08);
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · data-table</p>
    <h1>data-table：结构化数据写入、向量化与混合检索</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt-arch-title dt-arch-desc">
        <title id="dt-arch-title">data-table 架构：写入、向量化与检索</title>
        <desc id="dt-arch-desc">调用方通过数据集与行接口写入结构化数据，服务按 row、field 或组合策略向量化到 PostgreSQL 向量表，检索接口提供语义、关键词与混合三路召回。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- zone: API 层 -->
        <rect x="24" y="56" width="328" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="72" y="60" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="132" y="69" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">/API/DATABASE</text>

        <!-- zone: 服务层 -->
        <rect x="400" y="56" width="256" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="476" y="60" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="69" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

        <!-- zone: 存储层 -->
        <rect x="704" y="56" width="232" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="776" y="60" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="824" y="69" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POSTGRESQL</text>

        <!-- arrows (before nodes) -->
        <!-- A 写行 -> D DatabaseService -->
        <path d="M 240,168 H 476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="312" y="146" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="155" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

        <!-- B 检索 -> E 检索编排（主路径） -->
        <path d="M 240,296 H 476" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="308" y="274" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="346" y="283" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>

        <!-- C 向量直连 -> H kb_*（底部绕行，避开 OpenRouter） -->
        <path d="M 140,424 V 492 Q 140,500 148,500 H 854 Q 862,500 862,492 V 352" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="300" y="480" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="340" y="489" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VECTORS</text>

        <!-- D DatabaseService -> G rd_tbl_* -->
        <path d="M 656,168 H 820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="720" y="146" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="155" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROWS</text>

        <!-- E 检索编排 -> H kb_* -->
        <path d="M 656,296 H 820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="720" y="274" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="283" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

        <!-- D -> F OpenRouter（跨 E->H 处桥接） -->
        <path d="M 656,190 H 692 Q 700,190 700,198 V 288 a 8,8 0 0,1 0,16 V 444 Q 700,452 692,452 H 604" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="708" y="368" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="750" y="377" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMBED</text>

        <!-- nodes: API 层 -->
        <rect x="40" y="120" width="200" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="126" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="70" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROWS</text>
        <text x="140" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">数据集与行接口</text>
        <text x="140" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /:id/rows · keyColumn</text>

        <rect x="40" y="264" width="200" height="68" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="270" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="74" y="279" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>
        <text x="140" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">检索接口</text>
        <text x="140" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">semantic · keyword · hybrid</text>

        <rect x="40" y="368" width="200" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="48" y="374" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="76" y="383" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOW-LEVEL</text>
        <text x="140" y="408" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">向量直连（管理）</text>

        <!-- nodes: 服务层 -->
        <rect x="476" y="128" width="180" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="484" y="134" width="88" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="528" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATABASE.SVC</text>
        <text x="566" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">DatabaseService</text>
        <text x="566" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">事务 · keyColumn 冲突处理</text>

        <rect x="476" y="256" width="180" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="484" y="262" width="116" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="542" y="271" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROWS-SEARCH</text>
        <text x="566" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">检索编排</text>
        <text x="566" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">minScore · fusion · selectFields</text>

        <!-- nodes: 外部 -->
        <rect x="476" y="424" width="128" height="56" rx="6" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
        <text x="540" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">OpenRouter</text>
        <text x="540" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/embeddings</text>

        <!-- nodes: 存储层 -->
        <rect x="820" y="136" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="828" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="848" y="151" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
        <text x="870" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">rd_tbl_*</text>
        <text x="870" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">行 · key 唯一索引</text>

        <rect x="820" y="272" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="828" y="278" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="846" y="287" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HNSW</text>
        <text x="870" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">kb_*</text>
        <text x="870" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row / field 向量</text>

        <!-- legend -->
        <line x1="24" y1="560" x2="936" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="96" y1="573" x2="128" y2="573" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="136" y="576" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans SC',sans-serif">内部调用</text>
        <line x1="216" y1="573" x2="248" y2="573" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="256" y="576" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans SC',sans-serif">检索主路径</text>
        <line x1="352" y1="573" x2="384" y2="573" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <text x="392" y="576" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans SC',sans-serif">外部 / 管理通道</text>
        <rect x="496" y="566" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="516" y="576" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans SC',sans-serif">检索编排（核心）</text>
      </svg>
    </div>
  </div>
</body>
</html>
